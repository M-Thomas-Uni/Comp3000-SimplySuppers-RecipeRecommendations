services:
  app-backend:
    build: 
      context:  ./app-backend
    environment:
      NODE_ENV: ${NODE_ENV}
      NEO4J_AUTH_FILE: /run/secrets/neo4j_auth_file
      BACKEND_PORT: 9000
      FRONTEND_PORT: 3000
    volumes:
      - ./app-backend:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "82:9000"
    depends_on:
      suppers-db:
        condition: service_healthy
    secrets:
      - neo4j_auth_file

  app-frontend:
    build:
      context:  ./app-frontend
    environment:
      NODE_ENV: ${NODE_ENV}
      BACKEND_PORT: 9000
      FRONTEND_PORT: 3000
    volumes:
      - ./app-frontend:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "81:3000"
  
  suppers-db:
    image: neo4j:latest
    volumes:
      - ./suppers-db/data:/data
      - ./suppers-db/import:/import
    environment:
        - NEO4J_AUTH_FILE=/run/secrets/neo4j_auth_file 
    ports:
      - "7474:7474"
      - "7687:7687"
    restart: always
    secrets:
      - neo4j_auth_file
    healthcheck:
      test: wget http://localhost:7474 || exit 1
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 3s

secrets:
  neo4j_auth_file:
    file: ./secrets/neo4j_auth.txt #Normally this would not be put in the git repo, however this is not for production